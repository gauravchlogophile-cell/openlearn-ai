name: CI
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  content:
    name: Content & registry lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/validate-content.mjs   # dependency-free, runs cold

  build:
    name: Build (static)
    runs-on: ubuntu-latest
    needs: content
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci || npm install
      - run: npm run build
      - run: node scripts/generate-manifest.mjs
      - uses: actions/upload-artifact@v4
        with: { name: site, path: dist/ }

  db:
    name: Migrations + pgTAP (RLS matrix)
    runs-on: ubuntu-latest
    if: contains(join(github.event.pull_request.changed_files || '', ' '), 'supabase') || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
      - run: supabase start
      - run: supabase test db
