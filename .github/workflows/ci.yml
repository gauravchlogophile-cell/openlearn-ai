name: CI
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  content:
    name: Content & registry lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/validate-content.mjs   # dependency-free, runs cold

  test:
    name: Unit tests + typecheck
    runs-on: ubuntu-latest
    needs: content
    # This job did not exist. CI ran the content lint and a build, so the unit
    # suites — progress, quiz mechanics, SM-2, option shuffling, reader
    # preferences, the Sky assessment guard and week-core — had never once run
    # on a pull request. A build succeeding only proves the site compiles; it
    # says nothing about whether the streak maths is right or whether Sky will
    # hand a learner a quiz answer.
    #
    # `npm test` ends with `npm run typecheck` (astro sync && astro check),
    # which covers .astro pages as well as .ts/.tsx — tsc alone never looked
    # at a single page in src/pages.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci || npm install
      - run: npm test

  build:
    name: Build (static)
    runs-on: ubuntu-latest
    needs: content
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci || npm install
      - run: npm run build
      - run: node scripts/generate-manifest.mjs
      - uses: actions/upload-artifact@v4
        with: { name: site, path: dist/ }

  db:
    name: Migrations + pgTAP (RLS matrix)
    runs-on: ubuntu-latest
    # This used to be gated on:
    #   contains(join(github.event.pull_request.changed_files || '', ' '), 'supabase')
    # which never once evaluated true. In the webhook payload
    # `pull_request.changed_files` is a COUNT, not a list of paths, so that
    # expression asked whether a number like "21" contains "supabase".
    # The job therefore only ever ran on pushes to main — i.e. after merge,
    # when a broken migration is already on the default branch. That is how a
    # migration that aborts a clean `supabase start` reached main green.
    # Replaying migrations from scratch takes about a minute; correctness on
    # the branch is worth more than the minute.
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
      - run: supabase start
      - run: supabase test db
